[package]
name = "glance"
version = "0.1.0"
edition = "2021"
description = "Full-screen command-line system monitor for macOS"
authors = ["SunJiaxuan"]
publish = false

[[bin]]
name = "glance"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
